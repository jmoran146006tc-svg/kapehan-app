name: Deploy Expo App (Web & QR)
on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # 1. PERMANENT QR CODE (EAS Update)
      - name: Publish EAS Update
        run: eas update --branch main --message "GitHub Actions Auto-Update" --non-interactive

      # 2. PERMANENT WEB BUILD
      - name: Export web build
        run: npx expo export --platform web

      - name: Deploy web to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages